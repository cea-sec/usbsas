name: Barbacane

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck barbacane/system/*.sh barbacane/tests/*.sh

  phase1-mock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: dépendances
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkgconf clang cmake \
            libssl-dev libkrb5-dev libseccomp-dev libudev-dev libusb-1.0-0-dev \
            protobuf-compiler libdbus-1-dev libfuse3-dev clamav-daemon
      - name: transfert clé → clé (mock) avec EICAR
        run: barbacane/tests/phase1-mock.sh

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: dépendances
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends clamav-daemon 7zip bubblewrap \
            zip genisoimage gcab msitools qemu-utils dosfstools mtools
          # bubblewrap sans setuid sur Ubuntu : autoriser les espaces de noms utilisateur
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: fmt
        run: cd barbacane && cargo fmt --all --check
      - name: clippy
        run: cd barbacane && cargo clippy --all-targets -- -D warnings
      - name: tests
        run: cd barbacane && cargo test
      - name: audit
        run: cargo install --locked cargo-audit && cd barbacane && cargo audit
