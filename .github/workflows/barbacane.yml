name: Barbacane

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck barbacane/system/*.sh barbacane/system/iso/*.sh barbacane/tests/*.sh barbacane/tests/*/*.sh barbacane/update/barbacane-update-*

  barbacane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: dépendances
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends pkgconf clang cmake \
            libssl-dev libkrb5-dev libseccomp-dev libudev-dev libusb-1.0-0-dev \
            protobuf-compiler libdbus-1-dev libfuse3-dev clamav-daemon 7zip bubblewrap \
            zip genisoimage gcab msitools qemu-utils dosfstools mtools exfatprogs ntfs-3g fdisk \
            minisign zstd
          # bubblewrap sans setuid sur Ubuntu : autoriser les espaces de noms utilisateur
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: phase 1, transfert clé → clé usbsas (mock) avec EICAR
        run: barbacane/tests/phase1-mock.sh
      - name: fmt
        run: cd barbacane && cargo fmt --all --check
      - name: clippy
        run: cd barbacane && cargo clippy --no-deps --all-targets -- -D warnings
      - name: tests (analyseur, archives, bout en bout mock)
        run: cd barbacane && cargo test
      - name: mises à jour signées (préparation → application)
        run: cd barbacane && cargo build -p barbacane-admind && tests/maj/maj.sh
      - name: audit
        run: cargo install --locked cargo-audit && cd barbacane && cargo audit
