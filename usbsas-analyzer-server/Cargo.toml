[package]
name = "usbsas-analyzer-server"
description = "usbsas analyzer server (with clamav)"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0"

[dependencies]
actix-files = "0.7"
actix-web = { version = "4.17", default-features = false, features = ["macros", "compress-gzip"] }
clap = "4.6"
env_logger = "0.11"
flate2 = "1.1"
futures-util = "0.3"
libc = "0.2"
log = "0.4"
serde_json = "1.0"
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.54", features = ["fs", "io-util", "rt", "sync", "time"] }
uuid = { version = "1.28", features = ["v4"] }

[features]
integration-tests = []

# cargo-deb
[package.metadata.deb]
maintainer = "usbsas"
copyright = "usbsas"
revision = "1"
depends = "$auto, clamav-daemon, clamav-freshclam"
section = "utility"
priority = "optional"
maintainer-scripts = "debian/"
systemd-units = { enable = false }
assets = [
  ["target/release/usbsas-analyzer-server", "usr/bin/", "755"],
]
