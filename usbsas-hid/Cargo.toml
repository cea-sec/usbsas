[package]
name = "usbsas-hid"
version = "0.4.0"
edition = "2024"
license = "GPL-3.0"
description = "usbsas userland HID"

[dependencies]
bitfield = "0.19"
env_logger = "0.11"
libc = "0.2"
log = "0.4"
lazy_static = "1.5"
mio = { version = "1.2", features = ["os-ext"] }
rusb = { version = "0.9", features = ["vendored"] }
udev = { version = "0.9", features = ["mio"] }
usbsas-config = { path = "../usbsas-config" }
usbsas-sandbox = { path = "../usbsas-sandbox" }
usbsas-utils = { path = "../usbsas-utils" }

[[bin]]
name = "hid-dealer"
path = "src/hid-dealer.rs"

[[bin]]
name = "hid-user"
path = "src/hid-user.rs"

# cargo-deb
[package.metadata.deb]
name = "usbsas-hid"
maintainer = "usbsas"
copyright = "usbsas"
revision = "1"
depends = "$auto, usbsas-kiosk"
section = "utility"
priority = "optional"
maintainer-scripts = "debian/"
triggers-file = "debian/triggers"
assets = [
  ["target/release/hid-dealer", "usr/libexec/", "755"],
  ["target/release/hid-user", "usr/libexec/", "755"],
  ["assets/99-usbsas-hid.rules", "etc/udev/rules.d/", "644"],
  ["assets/hid.conf", "etc/modprobe.d/", "644"],
  ["assets/uinput.conf", "etc/modules-load.d/", "644"],
  ["assets/hid-dealer.service", "usr/lib/systemd/system/", "644"],
]
