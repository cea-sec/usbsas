[package]
name = "barbacane-analyzer"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
axum-server = { version = "0.8.0", features = ["tls-rustls-no-provider"] }
bytes = "1.12.1"
env_logger = "0.11.11"
futures-util = { version = "0.3.34", default-features = false }
hex = "0.4.3"
infer = "0.22.0"
jiff = "0.2.38"
libc = "0.2.191"
log = "0.4.34"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tar = "0.4.46"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
toml = "1.1.8"
uuid = { version = "1.29.0", features = ["v4"] }
yara-x = "1.22.1"
zeroize = "1.9.1"

[dev-dependencies]
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
