# Paramètres noyau de durcissement (installé dans /etc/default/grub.d/).
GRUB_CMDLINE_LINUX_DEFAULT="$GRUB_CMDLINE_LINUX_DEFAULT quiet slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 pti=on randomize_kstack_offset=on vsyscall=none debugfs=off lockdown=integrity iommu=force"
GRUB_TIMEOUT=0
GRUB_DISABLE_RECOVERY=true
