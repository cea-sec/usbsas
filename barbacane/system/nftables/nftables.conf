#!/usr/sbin/nft -f
# Barbacane : borne hors ligne, tout est bloqué sauf la boucle locale.
flush ruleset

table inet barbacane {
    chain input {
        type filter hook input priority 0; policy drop;
        iif "lo" accept
    }
    chain forward {
        type filter hook forward priority 0; policy drop;
    }
    chain output {
        type filter hook output priority 0; policy drop;
        oif "lo" accept
    }
}
