# Installation entièrement automatique, hors ligne. Efface le disque interne choisi par choisir-disque.sh.
# Langue et pays : paramètre « locale= » du menu de démarrage (fr_FR.UTF-8).
d-i keyboard-configuration/xkb-keymap select fr
d-i hw-detect/load_firmware boolean true

# Aucun réseau
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string barbacane
d-i netcfg/get_domain string
d-i netcfg/hostname string barbacane
d-i apt-setup/use_mirror boolean false
d-i apt-setup/no_mirror boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/services-select multiselect
d-i apt-setup/security_host string
d-i mirror/country string manual
d-i mirror/http/hostname string
d-i mirror/http/directory string
d-i mirror/http/proxy string

# Comptes : root avec un mot de passe aléatoire (jeté), verrouillé par configurer.sh ; aucun utilisateur
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password @HACHE_ROOT@
d-i passwd/make-user boolean false

d-i clock-setup/utc boolean true
d-i time/zone string Europe/Paris
d-i clock-setup/ntp boolean false

# Disque : choisi par partman/early_command, entièrement effacé
d-i partman/early_command string sh /cdrom/barbacane/choisir-disque.sh
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-lvm/confirm boolean true
d-i partman-lvm/confirm_nooverwrite boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/choose_label select gpt
d-i partman-partitioning/default_label string gpt
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Paquets (depuis l'ISO seulement)
tasksel tasksel/first multiselect
d-i pkgsel/run_tasksel boolean false
d-i pkgsel/upgrade select none
d-i pkgsel/update-policy select none
popularity-contest popularity-contest/participate boolean false

# Amorçage : aussi en chemin UEFI « amovible » (micrologiciels capricieux)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/force-efi-extra-removable boolean true

# Configuration Barbacane, puis redémarrage sur l'interface
d-i preseed/late_command string sh /cdrom/barbacane/fin-installation.sh
d-i finish-install/reboot_in_progress note
d-i cdrom-detect/eject boolean true
