# Durcissement du service usbsas (le processus applique en plus seccomp/landlock à chaque fils).
[Unit]
After=network-pre.target
[Service]
# Lecture des dossiers de préparation (groupe barbacane)
SupplementaryGroups=barbacane
UMask=0007
NoNewPrivileges=yes
ProtectSystem=strict
ReadWritePaths=/var/lib/usbsas
ProtectHome=yes
PrivateTmp=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectKernelLogs=yes
ProtectControlGroups=yes
ProtectClock=yes
ProtectHostname=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6 AF_NETLINK
IPAddressAllow=localhost
IPAddressDeny=any
CapabilityBoundingSet=
SystemCallArchitectures=native
MemoryMax=8G
