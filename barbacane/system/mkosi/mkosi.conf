# Image disque Barbacane prête à flasher (mkosi ≥ 25).
#
#   1. construire les paquets : barbacane/system/build-debs.sh (→ barbacane/system/mkosi/paquets/)
#   2. déposer la clé publique de mise à jour : mkosi.extra/etc/barbacane/maj.pub
#      (et éventuellement une base ClamAV dans mkosi.extra/var/lib/clamav/)
#   3. mkosi -f build   (BARBACANE_PIN=xxxxxx facultatif : sinon PIN choisi au premier démarrage)
#   4. flasher image.raw sur le disque de la borne (dd ou outil de flashage)

[Distribution]
Distribution=debian
Release=trixie
Repositories=main,contrib,non-free,non-free-firmware

[Output]
ImageId=barbacane
Format=disk
CompressOutput=zstd

[Content]
Bootable=yes
Bootloader=systemd-boot
UnifiedKernelImages=yes
KernelCommandLine=quiet slab_nomerge init_on_alloc=1 init_on_free=1 page_alloc.shuffle=1 pti=on randomize_kstack_offset=on vsyscall=none debugfs=off lockdown=integrity iommu=force
RootPassword=!
Locale=fr_FR.UTF-8
Keymap=fr
Timezone=Europe/Paris
Hostname=barbacane
PackageDirectories=paquets
Packages=
    linux-image-amd64
    systemd
    systemd-sysv
    systemd-boot
    udev
    dbus
    kbd
    firmware-linux-free
    locales
    clamav-daemon
    7zip
    7zip-rar
    bubblewrap
    cage
    nftables
    minisign
    zstd
    fonts-dejavu-core
    libwayland-egl1
    libegl1
    libgl1
    mesa-vulkan-drivers
    usbsas-server
    usbsas-hid
    barbacane
RemovePackages=
    openssh-server
    ifupdown
    isc-dhcp-client
Environment=BARBACANE_PIN
PostInstallationScripts=../iso/configurer.sh
