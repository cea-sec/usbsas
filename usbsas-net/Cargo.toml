[package]
name = "usbsas-net"
description = "usbsas-net"
version = "0.3.2"
edition = "2024"
license = "GPL-3.0"

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["std"], optional = true }
byteorder = "1.5"
flate2 = { version = "1.1", features = ["zlib-rs"], default-features = false }
libgssapi = { version = "0.11", optional = true }
log = "0.4"
reqwest = { version = "0.13", default-features = false, features = ["blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
url = "2.5"
usbsas-comm = { path = "../usbsas-comm" }
usbsas-config = { path = "../usbsas-config" }
usbsas-process = { path = "../usbsas-process" }
usbsas-proto = { path = "../usbsas-proto" }
usbsas-sandbox = { path = "../usbsas-sandbox" }
usbsas-utils = { path = "../usbsas-utils" }

[features]
authkrb = ["base64", "libgssapi"]
native-tls = ["reqwest/native-tls"]
rustls = ["reqwest/rustls"]
allow-http = []
default = ["native-tls"]

[[bin]]
path = "src/bin/analyzer.rs"
name = "usbsas-analyzer"

[[bin]]
path = "src/bin/uploader.rs"
name = "usbsas-uploader"

[[bin]]
path = "src/bin/downloader.rs"
name = "usbsas-downloader"

[[bin]]
path = "src/bin/jsonparser.rs"
name = "usbsas-jsonparser"
