[package]
name = "usbsas-client"
version = "0.3.3"
edition = "2024"
license = "GPL-3.0"
description = "Graphical User Interface for usbsas"

[dependencies]
bytesize = "2.7"
clap = { version = "4.6", features = ["string"] }
env_logger = "0.11"
iced = { version = "0.14", default-features = false, features = ["wgpu", "tiny-skia", "crisp", "thread-pool", "advanced", "image", "smol", "svg", "wayland", "x11"] }
libc = "0.2"
log = "0.4"
serde_json = "1.0"
sysinfo = "0.39"
time = { version = "0.3", features = ["local-offset"] }
tokio = { version = "1.53", features = ["sync"] }
tokio-stream = "0.1"
usbsas-comm = { path = "../usbsas-comm" }
usbsas-config = { path = "../usbsas-config" }
usbsas-proto = { path = "../usbsas-proto" }
usbsas-sandbox = { path = "../usbsas-sandbox" }
usbsas-utils = { path = "../usbsas-utils" }
uuid = { version = "1.25", features = ["v4"] }

# cargo-deb
[package.metadata.deb]
name = "usbsas-kiosk"
maintainer = "usbsas"
copyright = "usbsas"
revision = "1"
depends = "$auto, usbsas-server, xserver-xorg-core, x11-xserver-utils, libxkbcommon-x11-0, xinit, xdotool, unclutter, fonts-noto-color-emoji"
section = "utility"
priority = "optional"
maintainer-scripts = "debian/"
systemd-units = { unit-name = "usbsas-client", enable = false }
assets = [
  ["target/release/usbsas-client", "usr/bin/", "755"],
  ["assets/usbsas-client-xinit", "usr/bin/", "755"],
]
